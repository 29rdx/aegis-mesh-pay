spring.application.name=aegis-mesh-pay
server.port=8080

spring.datasource.url=jdbc:h2:mem:aegismesh;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# In-memory H2 Console (Disabled in prod, enabled for audit dev inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & Mesh Configuration
aegis.mesh.bridge.auth-token=aegis-sec-bridge-token-2026-xyz
aegis.mesh.rate-limit.burst-capacity=50
aegis.mesh.rate-limit.refill-rate=10
aegis.mesh.voucher.max-allowance=10000.00
